# Warm Cloudflare edge cache from a US GitHub-hosted runner (US PoP).
# Manual only — does not run on every push.
#
# GitHub → Actions → "Warm Cloudflare cache (US)" → Run workflow
name: Warm Cloudflare cache (US)

on:
  workflow_dispatch:
    inputs:
      scope:
        description: What to warm
        type: choice
        options:
          - pages
          - images
          - both
        default: both
      limit:
        description: Max URLs (pages or images). Empty = all.
        type: string
        default: ''
      delay_ms:
        description: Pause between requests (ms). Higher = safer for Imunify.
        type: string
        default: '1500'
      concurrency:
        description: Parallel page requests (keep 1–2)
        type: string
        default: '1'

jobs:
  warm:
    name: Warm from US runner
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect Cloudflare colo
        id: colo
        run: |
          set -euo pipefail
          RAY=$(curl -sI --max-time 20 https://panoramicireland.com/ \
            | tr -d '\r' \
            | awk -F': ' 'BEGIN{IGNORECASE=1} $1=="cf-ray"{print $2; exit}')
          COLO=$(printf '%s' "$RAY" | awk -F- '{print toupper($NF)}')
          if [ -z "$COLO" ]; then COLO=unknown; fi
          echo "cf_ray=${RAY}" >> "$GITHUB_OUTPUT"
          echo "colo=${COLO}" >> "$GITHUB_OUTPUT"
          echo "CF colo: ${COLO} (cf-ray: ${RAY:-none})"
          echo "### Cloudflare edge" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Colo:** \`${COLO}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **CF-Ray:** \`${RAY:-none}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Warm HTML pages (sitemap)
        if: inputs.scope == 'pages' || inputs.scope == 'both'
        env:
          LIMIT: ${{ inputs.limit }}
          DELAY: ${{ inputs.delay_ms }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          set -euo pipefail
          ARGS=(--concurrency="$CONCURRENCY" --delay="$DELAY")
          if [ -n "${LIMIT}" ]; then
            ARGS+=(--limit="$LIMIT")
          fi
          echo "CF colo (probe): ${{ steps.colo.outputs.colo }}"
          echo "Running: node scripts/warm-cache.mjs ${ARGS[*]}"
          node scripts/warm-cache.mjs "${ARGS[@]}"

      - name: Warm images (sitemap image:loc)
        if: inputs.scope == 'images' || inputs.scope == 'both'
        env:
          LIMIT: ${{ inputs.limit }}
          DELAY: ${{ inputs.delay_ms }}
        run: |
          set -euo pipefail
          ARGS=(--concurrency=1 --delay="$DELAY")
          if [ -n "${LIMIT}" ]; then
            ARGS+=(--limit="$LIMIT")
          fi
          echo "CF colo (probe): ${{ steps.colo.outputs.colo }}"
          echo "Running: node scripts/warm-images.mjs ${ARGS[*]}"
          node scripts/warm-images.mjs "${ARGS[@]}"
