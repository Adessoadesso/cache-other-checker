# Daily smoke: HTML status, redirect loops, CF cache headers, sample media.
#
# Manual: GitHub → Actions → "Check live (cache + redirects)" → Run workflow
name: Check live (cache + redirects)

on:
  schedule:
    # 06:00 UTC daily
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check:
    name: check:live
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run live checks
        run: npm run check:live

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-check-report
          path: reports/live-check.json
          if-no-files-found: ignore
